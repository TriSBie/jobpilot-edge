<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Không tìm thấy trang · JobPilot</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--bg:#FFFFFF;--ink:#0A0A0A;--mute:#60646C;--brand:#4F5BD5;--brand-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#08090A;--ink:#F7F8F8;--mute:#8A8F98;--brand:#7C8CFF;--brand-ink:#08090A}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
h1{font:700 26px/1.3 "Be Vietnam Pro",Inter,system-ui,sans-serif;margin:16px 0 8px}
p{color:var(--mute);margin:0 0 24px}
a{display:inline-block;min-height:44px;line-height:44px;padding:0 20px;border-radius:10px;background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600}
a:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="/favicon.svg" width="56" height="56" alt="">
<h1>Không tìm thấy trang này</h1>
<p>Đường dẫn có thể đã đổi hoặc không còn tồn tại.</p>
<a href="/">Về trang chủ JobPilot</a>
</main>
</body>
</html>
